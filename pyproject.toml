[tool.poetry]
name = "altloss"
version = "0.1.0"
description = "alternative loss model"
authors = ["Alex Constandache <alex.constandache@fishsciences.net>"]
readme = "README.md"
license = "BSD"
packages = [
  { include = "altloss" }
]
package-mode = true
include = [
  { path = "stan/mrp3.stan", format = ["sdist", "wheel"] } 
]

[tool.poetry.dependencies]
python = "^3.10"
cmdstanpy = "^1.2.5"
pandas = "^2.2.3"
openpyxl = "^3.1.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "altloss"

[tool.poetry.scripts]
altloss = "altloss.cli:main"
